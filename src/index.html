<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI-Tools-Hub · 你的AI军火库</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --card: #1a2130; --border: #2d3748;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --green: #3fb950; --orange: #f0883e; --red: #f85149;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  header {
    padding: 18px 28px; display: flex; align-items: center; gap: 16px;
    border-bottom: 1px solid var(--border); background: linear-gradient(180deg, #161b22, var(--bg));
  }
  header h1 { font-size: 20px; } header h1 span { color: var(--accent); }
  header .sub { color: var(--muted); font-size: 12px; }
  #toolbar { margin-left: auto; display: flex; gap: 10px; }
  button {
    background: #21262d; color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 16px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: #1f6feb; border-color: #1f6feb; }
  button:disabled { opacity: .5; cursor: wait; }
  #stats { padding: 10px 28px; color: var(--muted); font-size: 12px; display: flex; gap: 18px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; padding: 18px 28px 40px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px;
    display: flex; flex-direction: column; gap: 12px; transition: border-color .15s;
  }
  .card:hover { border-color: #3d4b63; }
  .card-head { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px; color: #fff; background: linear-gradient(135deg, #1f6feb, #8957e5);
  }
  .card-title { font-size: 16px; font-weight: 600; }
  .card-fullname { font-size: 11px; color: var(--muted); }
  .badge { margin-left: auto; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .badge.ok { background: #12352150; color: var(--green); border: 1px solid #2ea04366; }
  .badge.update { background: #3d2e0066; color: var(--orange); border: 1px solid #f0883e66; }
  .badge.no { background: #2d141850; color: var(--red); border: 1px solid #f8514966; }
  .desc { font-size: 13px; line-height: 1.6; color: #c9d1d9; }
  .solves { font-size: 12px; color: var(--muted); line-height: 1.5; background: #21262d80; padding: 8px 10px; border-radius: 8px; }
  .solves b { color: var(--accent); font-weight: 600; }
  .caps { display: flex; flex-wrap: wrap; gap: 6px; }
  .cap { font-size: 11px; padding: 3px 8px; border-radius: 4px; background: #21262d; color: #a5b4fc; border: 1px solid #30363d; }
  .ver-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .ver-row b { color: var(--text); font-weight: 600; }
  .skills { border-top: 1px dashed var(--border); padding-top: 10px; }
  .skill-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 12px; }
  .skill-row .name { flex: 1; }
  .skill-row .agents { color: var(--muted); font-size: 10px; }
  .actions { display: flex; gap: 8px; margin-top: auto; }
  .actions button { flex: 1; padding: 8px 0; }
  .log {
    margin: 0 28px 20px; max-height: 180px; overflow: auto; display: none;
    background: #010409; border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    font-family: Consolas, monospace; font-size: 12px; color: #7ee787; white-space: pre-wrap;
  }
  .log.show { display: block; }
  .empty { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 60px 0; }
  .spin { display: inline-block; animation: r 1s linear infinite; } @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>🧰 AI-Tools-Hub</h1>
  <div class="sub">你的AI军火库 · CLI 工具 / MCP / 技能一站式安装与更新</div>
  <div id="toolbar">
    <button id="btn-check">🔄 检查全部更新</button>
    <button id="btn-registry" class="primary">📦 刷新清单</button>
  </div>
</header>
<div id="stats">加载中…</div>
<div class="log" id="log"></div>
<div id="grid"><div class="empty">正在加载工具清单…</div></div>

<script>
const $ = s => document.querySelector(s);
const grid = $('#grid'), stats = $('#stats'), log = $('#log');
let registry = null; // { registry, source }
let states = {};     // id → inspect 结果

function showLog(text) { log.textContent = text || ''; log.classList.toggle('show', !!text); log.scrollTop = log.scrollHeight; }
function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

function badge(st) {
  if (!st) return `<span class="badge no">检测中…</span>`;
  if (st.error && !st.installed) return `<span class="badge no">未安装</span>`;
  if (st.hasUpdate) return `<span class="badge update">⬆ 可更新 → ${esc(st.latestVersion)}</span>`;
  if (st.installed) return `<span class="badge ok">✔ 最新 ${esc(st.localVersion)}</span>`;
  return `<span class="badge no">未安装</span>`;
}

function render() {
  const tools = registry.registry.tools;
  if (!tools.length) { grid.innerHTML = `<div class="empty">清单为空</div>`; return; }
  grid.innerHTML = tools.map(t => {
    const st = states[t.id];
    const caps = (t.capabilities || []).map(c => `<span class="cap">${esc(c)}</span>`).join('');
    const skills = (t.skills || []).map((s, i) => `
      <div class="skill-row">
        <span class="name">🧩 ${esc(s.name)}</span>
        <span class="agents">${esc((s.agents || []).join('/'))}</span>
        <button data-skill="${t.id}:${i}" ${!st?.installed ? 'disabled' : ''}>启用</button>
      </div>`).join('');
    return `
    <div class="card">
      <div class="card-head">
        <div class="logo">${esc(t.name.slice(0, 2).toUpperCase())}</div>
        <div><div class="card-title">${esc(t.name)}</div><div class="card-fullname">${esc(t.fullName || '')}</div></div>
        ${badge(st)}
      </div>
      <div class="desc">${esc(t.description)}</div>
      <div class="solves"><b>解决什么：</b>${esc(t.solves || '')}</div>
      <div class="caps">${caps}</div>
      <div class="ver-row">
        <span>本地版本：<b>${st?.installed ? esc(st.localVersion || '?') : '—'}</b></span>
        <span>最新版本：<b>${st?.installed ? esc(st.latestVersion || '?') : '—'}</b></span>
      </div>
      <div class="skills">${skills || ''}</div>
      <div class="actions">
        ${st?.installed
          ? (st.hasUpdate ? `<button class="primary" data-install="${t.id}">⬆ 升级到 ${esc(st.latestVersion)}</button>`
                          : `<button data-install="${t.id}">↻ 重装</button>`)
          : `<button class="primary" data-install="${t.id}">⬇ 一键安装</button>`}
        <button data-open="${esc(t.homepage || '')}">🔗 主页</button>
      </div>
    </div>`;
  }).join('');
  updateStats();
}

function updateStats() {
  const tools = registry.registry.tools;
  const done = tools.filter(t => states[t.id]).length;
  const installed = tools.filter(t => states[t.id]?.installed).length;
  const updates = tools.filter(t => states[t.id]?.hasUpdate).length;
  stats.innerHTML = `<span>清单来源：${registry.source === 'remote' ? 'GitHub（远程）' : '内置'}</span>
    <span>共 ${tools.length} 个工具</span><span>已装 ${installed}</span><span style="color:${updates ? 'var(--orange)' : 'inherit'}">可更新 ${updates}</span>
    ${done < tools.length ? `<span><span class="spin">⏳</span> 检测中 ${done}/${tools.length}</span>` : ''}`;
}

async function checkOne(tool) {
  states[tool.id] = await window.aihub.inspectTool(tool);
  render();
}

async function checkAll() {
  $('#btn-check').disabled = true;
  showLog('开始检查所有工具更新…');
  const results = await window.aihub.checkAllUpdates(registry.registry.tools);
  results.forEach(r => { states[r.id] = r; });
  showLog(results.map(r => `${r.id}: ${r.installed ? (r.hasUpdate ? `${r.localVersion} → ${r.latestVersion} 可更新` : `已最新 ${r.localVersion}`) : '未安装'}`).join('\n'));
  render();
  $('#btn-check').disabled = false;
}

grid.addEventListener('click', async e => {
  const btn = e.target.closest('button'); if (!btn || btn.disabled) return;
  const tools = registry.registry.tools;
  if (btn.dataset.install) {
    const t = tools.find(x => x.id === btn.dataset.install);
    btn.disabled = true; btn.textContent = '⏳ 执行中…';
    showLog(`正在安装 ${t.name}…\n${t.install.oneLiner || ''}\n`);
    const r = await window.aihub.installTool(t);
    showLog(prev => prev); // noop
    showLog((log.textContent || '') + `\n--- 安装结果 ---\n${r.ok ? '✅ 成功' : '❌ 失败'}\n${r.output || ''}`);
    states[t.id] = await window.aihub.inspectTool(t);
    render();
  } else if (btn.dataset.skill) {
    const [id, idx] = btn.dataset.skill.split(':');
    const t = tools.find(x => x.id === id); const s = t.skills[+idx];
    btn.disabled = true; btn.textContent = '⏳';
    const r = await window.aihub.installSkill(t, s);
    btn.textContent = r.ok ? '✔ 已启用' : '✘ 失败';
    showLog(`${s.name} (${s.installCmd})\n${r.output || ''}`);
  } else if (btn.dataset.open) {
    window.aihub.openExternal(btn.dataset.open);
  }
});

$('#btn-check').onclick = checkAll;
$('#btn-registry').onclick = async () => { states = {}; await boot(); };

async function boot() {
  grid.innerHTML = `<div class="empty">加载中…</div>`;
  registry = await window.aihub.loadRegistry();
  render();
  registry.registry.tools.forEach(t => checkOne(t)); // 并发逐个检测
  checkAll();
}
boot();
</script>
</body>
</html>
