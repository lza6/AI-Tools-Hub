<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI-Tools-Hub · 你的AI军火库</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --card: #1a2130; --border: #2d3748;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --green: #3fb950; --orange: #f0883e; --red: #f85149; --purple: #a371f7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  header {
    padding: 14px 28px; display: flex; align-items: center; gap: 14px;
    border-bottom: 1px solid var(--border); background: linear-gradient(180deg, #161b22, var(--bg));
  }
  header img { height: 40px; border-radius: 8px; }
  header h1 { font-size: 20px; } header h1 span { color: var(--accent); }
  header .sub { color: var(--muted); font-size: 12px; }
  #toolbar { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  #platform-tag { font-size: 11px; color: var(--muted); border: 1px solid var(--border); padding: 4px 10px; border-radius: 20px; }
  button {
    background: #21262d; color: var(--text); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 16px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: #1f6feb; border-color: #1f6feb; }
  button.ghost { padding: 5px 10px; font-size: 12px; }
  button:disabled { opacity: .5; cursor: wait; }
  /* 筛选栏 */
  #filters { display: flex; gap: 8px; align-items: center; padding: 12px 28px 0; flex-wrap: wrap; }
  .chip {
    padding: 6px 14px; border-radius: 20px; font-size: 12px; cursor: pointer;
    background: #21262d; border: 1px solid var(--border); color: var(--muted); user-select: none;
  }
  .chip:hover { color: var(--text); }
  .chip.active { background: #1f6feb33; border-color: var(--accent); color: var(--accent); }
  .chip .cnt { opacity: .7; margin-left: 4px; }
  #stats { padding: 8px 28px; color: var(--muted); font-size: 12px; display: flex; gap: 18px; align-items: center; }
  #search {
    background: #0d1117; border: 1px solid var(--border); color: var(--text); border-radius: 6px;
    padding: 7px 12px; font-size: 13px; width: 220px; outline: none;
  }
  #search:focus { border-color: var(--accent); }
  /* 网格 */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; padding: 14px 28px 10px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px;
    display: flex; flex-direction: column; gap: 11px; transition: border-color .15s; cursor: pointer;
  }
  .card:hover { border-color: #3d4b63; }
  .card-head { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; color: #fff; background: linear-gradient(135deg, #1f6feb, #8957e5); flex-shrink: 0;
  }
  .card-title { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .card-fullname { font-size: 11px; color: var(--muted); }
  .type-tag { font-size: 10px; padding: 2px 8px; border-radius: 4px; background: #8957e533; color: var(--purple); border: 1px solid #8957e566; font-weight: 500; }
  .badge { margin-left: auto; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .badge.ok { background: #12352150; color: var(--green); border: 1px solid #2ea04366; }
  .badge.update { background: #3d2e0066; color: var(--orange); border: 1px solid #f0883e66; }
  .badge.no { background: #2d141850; color: var(--red); border: 1px solid #f8514966; }
  .desc { font-size: 13px; line-height: 1.6; color: #c9d1d9; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .caps { display: flex; flex-wrap: wrap; gap: 6px; }
  .cap { font-size: 11px; padding: 3px 8px; border-radius: 4px; background: #21262d; color: #a5b4fc; border: 1px solid #30363d; }
  .ver-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .ver-row b { color: var(--text); font-weight: 600; }
  .skill-line { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .agent-pill { font-size: 10px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); }
  .agent-pill.on { color: var(--green); border-color: #2ea04366; background: #12352150; }
  .agent-pill.off { color: var(--muted); }
  .actions { display: flex; gap: 8px; margin-top: auto; }
  .actions button { flex: 1; padding: 8px 0; }
  .actions button.icon-btn { flex: 0 0 42px; display: flex; align-items: center; justify-content: center; }
  .actions button.icon-btn svg { width: 18px; height: 18px; fill: var(--text); }
  /* 详情弹窗 */
  #modal-mask {
    display: none; position: fixed; inset: 0; background: #000000cc; z-index: 50;
    align-items: flex-start; justify-content: center; overflow-y: auto; padding: 40px 20px;
  }
  #modal-mask.show { display: flex; }
  #modal {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    max-width: 760px; width: 100%; padding: 28px; display: flex; flex-direction: column; gap: 16px;
  }
  #modal .m-head { display: flex; align-items: center; gap: 14px; }
  #modal .m-head .logo { width: 56px; height: 56px; font-size: 20px; }
  #modal h2 { font-size: 20px; }
  #modal .m-close { margin-left: auto; background: none; border: none; font-size: 22px; color: var(--muted); cursor: pointer; }
  #modal .m-section h3 { font-size: 13px; color: var(--accent); margin-bottom: 6px; }
  #modal .m-section p { font-size: 13px; line-height: 1.7; color: #c9d1d9; }
  #modal .oneliner { background: #010409; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-family: Consolas, monospace; font-size: 12px; color: #7ee787; overflow-x: auto; }
  #modal .skill-block { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  #modal .skill-agents { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  /* 分页 */
  #pager { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 16px 0 36px; }
  #pager .page-info { color: var(--muted); font-size: 12px; }
  .log {
    margin: 0 28px 12px; max-height: 200px; overflow: auto; display: none;
    background: #010409; border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    font-family: Consolas, monospace; font-size: 12px; color: #7ee787; white-space: pre-wrap;
  }
  .log.show { display: block; }
  .empty { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 60px 0; }
  .spin { display: inline-block; animation: r 1s linear infinite; } @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <img src="../assets/logo-256.png" alt="logo">
  <h1>AI-Tools-<span>Hub</span></h1>
  <div class="sub">你的AI军火库 · CLI 工具 / MCP / 技能 / Hook 一站式安装与更新</div>
  <div id="toolbar">
    <span id="platform-tag"></span>
    <input id="search" placeholder="🔍 搜索工具…">
    <button id="btn-check">🔄 检查全部更新</button>
    <button id="btn-registry" class="primary">📦 刷新清单</button>
  </div>
</header>

<div id="filters"></div>
<div id="self-update" style="display:none; margin: 10px 28px 0; padding: 10px 16px; border-radius: 8px; background: #1f6feb22; border: 1px solid #1f6feb66; font-size: 13px; display:flex; align-items:center; gap:12px;">
  <span id="su-text">🔄 检查应用更新…</span>
  <button id="su-action" class="ghost" style="display:none">操作</button>
</div>
<div id="stats"></div>
<div class="log" id="log"></div>
<div id="grid"></div>
<div id="pager"></div>

<div id="modal-mask"><div id="modal"></div></div>

<script>
const $ = s => document.querySelector(s);
const grid = $('#grid'), stats = $('#stats'), log = $('#log'), pager = $('#pager');
const PAGE_SIZE = 9;
let registry = null, states = {}, skillStates = {}, curType = 'all', curPage = 1, keyword = '', PLATFORM = '';

const TYPE_NAMES = { 'cli-tool': 'CLI 工具', 'mcp': 'MCP', 'skill': '技能', 'hook': 'Hook', 'agent': 'Agent' };
const AGENT_NAMES = { 'claude-code': 'Claude Code', 'codex': 'Codex', 'claude-desktop': 'Claude Desktop', 'opencode': 'OpenCode', 'cursor': 'Cursor' };
const PLATFORM_NAMES = { win32: 'Windows', darwin: 'macOS', linux: 'Linux' };

function showLog(t) { log.textContent = t || ''; log.classList.toggle('show', !!t); log.scrollTop = log.scrollHeight; }
function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
const GH_ICON = `<svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>`;

function filteredTools() {
  const tools = registry.registry.tools;
  return tools.filter(t =>
    (curType === 'all' || (t.type || 'cli-tool') === curType) &&
    (!keyword || (t.name + t.fullName + t.description + (t.capabilities || []).join(' ')).toLowerCase().includes(keyword))
  );
}

function badge(st) {
  if (!st) return `<span class="badge no">检测中…</span>`;
  if (st.hasUpdate) return `<span class="badge update">⬆ 可更新 → ${esc(st.latestVersion)}</span>`;
  if (st.installed) return `<span class="badge ok">✔ 最新 ${esc(st.localVersion)}</span>`;
  return `<span class="badge no">未安装</span>`;
}

function skillLine(t) {
  const skills = t.skills || [];
  if (!skills.length) return '';
  const st = skillStates[t.id] || {};
  return skills.map(s => {
    const ags = s.agents || [];
    const pills = ags.map(a => {
      const on = st[s.name]?.[a];
      if (on === undefined) return `<span class="agent-pill off">${esc(AGENT_NAMES[a] || a)}: ?</span>`;
      return `<span class="agent-pill ${on ? 'on' : 'off'}">${esc(AGENT_NAMES[a] || a)}: ${on ? '✔ 已启用' : '未启用'}</span>`;
    }).join(' ');
    return `<div class="skill-line">🧩 ${esc(s.name)} ${pills}</div>`;
  }).join('');
}

function cardHTML(t) {
  const st = states[t.id];
  const type = TYPE_NAMES[t.type || 'cli-tool'] || t.type;
  const caps = (t.capabilities || []).slice(0, 4).map(c => `<span class="cap">${esc(c)}</span>`).join('');
  const plat = (t.install?.[PLATFORM] || t.install?.windows || t.install?.linux) ? '' : '';
  return `
  <div class="card" data-detail="${t.id}">
    <div class="card-head">
      <div class="logo">${esc(t.name.slice(0, 2).toUpperCase())}</div>
      <div>
        <div class="card-title">${esc(t.name)} <span class="type-tag">${esc(type)}</span></div>
        <div class="card-fullname">${esc(t.fullName || '')}</div>
      </div>
      ${badge(st)}
    </div>
    <div class="desc">${esc(t.description)}</div>
    <div class="caps">${caps}</div>
    <div class="ver-row">
      <span>本地：<b>${st?.installed ? esc(st.localVersion || '?') : '—'}</b></span>
      <span>最新：<b>${st?.installed ? esc(st.latestVersion || '?') : '—'}</b></span>
    </div>
    ${skillLine(t)}
    <div class="actions">
      ${st?.installed
        ? (st.hasUpdate ? `<button class="primary" data-install="${t.id}">⬆ 升级 ${esc(st.latestVersion)}</button>`
                        : `<button data-install="${t.id}">↻ 重装</button>`)
        : `<button class="primary" data-install="${t.id}">⬇ 一键安装</button>`}
      <button class="icon-btn" title="GitHub 仓库" data-open="${esc(t.repo ? 'https://github.com/' + t.repo : t.homepage || '')}">${GH_ICON}</button>
      <button class="icon-btn" title="详情" data-detail-btn="${t.id}">📄</button>
    </div>
  </div>`;
}

function render() {
  // 筛选 chips
  const tools = registry.registry.tools;
  const types = [...new Set(tools.map(t => t.type || 'cli-tool'))];
  $('#filters').innerHTML = [`<span class="chip ${curType === 'all' ? 'active' : ''}" data-type="all">全部<span class="cnt">${tools.length}</span></span>`]
    .concat(types.map(tp => `<span class="chip ${curType === tp ? 'active' : ''}" data-type="${esc(tp)}">${esc(TYPE_NAMES[tp] || tp)}<span class="cnt">${tools.filter(x => (x.type || 'cli-tool') === tp).length}</span></span>`)).join('');
  // 卡片分页
  const list = filteredTools();
  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  curPage = Math.min(curPage, totalPages);
  const pageItems = list.slice((curPage - 1) * PAGE_SIZE, curPage * PAGE_SIZE);
  grid.innerHTML = pageItems.length ? pageItems.map(cardHTML).join('') : `<div class="empty">没有匹配的工具</div>`;
  pager.innerHTML = totalPages > 1 ? `
    <button class="ghost" id="pg-prev" ${curPage <= 1 ? 'disabled' : ''}>‹ 上一页</button>
    <span class="page-info">第 ${curPage} / ${totalPages} 页（共 ${list.length} 个）</span>
    <button class="ghost" id="pg-next" ${curPage >= totalPages ? 'disabled' : ''}>下一页 ›</button>` : '';
  const prev = $('#pg-prev'), next = $('#pg-next');
  if (prev) prev.onclick = () => { curPage--; render(); };
  if (next) next.onclick = () => { curPage++; render(); };
  updateStats();
}

function updateStats() {
  const tools = registry.registry.tools;
  const installed = tools.filter(t => states[t.id]?.installed).length;
  const updates = tools.filter(t => states[t.id]?.hasUpdate).length;
  const detected = tools.filter(t => states[t.id]).length;
  stats.innerHTML = `<span>清单：${registry.source === 'remote' ? 'GitHub 远程' : '内置'}</span>
    <span>共 ${tools.length} 个</span><span>已装 ${installed}</span>
    <span style="color:${updates ? 'var(--orange)' : 'inherit'}">可更新 ${updates}</span>
    ${detected < tools.length ? `<span><span class="spin">⏳</span> ${detected}/${tools.length}</span>` : ''}`;
}

// ---------- 详情弹窗 ----------
async function openDetail(id) {
  const t = registry.registry.tools.find(x => x.id === id);
  if (!t) return;
  const st = states[id] || {};
  const type = TYPE_NAMES[t.type || 'cli-tool'] || t.type;
  const platInst = t.install?.[PLATFORM] || t.install?.windows || t.install?.linux || {};
  const caps = (t.capabilities || []).map(c => `<span class="cap">${esc(c)}</span>`).join('');
  const skills = (t.skills || []).map((s, i) => {
    const ags = (s.agents || []).map(a => {
      const on = skillStates[id]?.[s.name]?.[a];
      return `<span class="agent-pill ${on ? 'on' : 'off'}" data-agent="${a}" data-skill="${i}">${esc(AGENT_NAMES[a] || a)}: ${on ? '✔ 已启用' : on === false ? '未启用' : '…'}</span>`;
    }).join(' ');
    return `<div class="skill-block">
      <div><b>${esc(s.name)}</b> <span style="color:var(--muted);font-size:11px">· ${esc((s.agents || []).map(a => AGENT_NAMES[a] || a).join('/'))}</span></div>
      <div style="font-size:12px;color:var(--muted)">${esc(s.description || '')}</div>
      <div class="skill-agents">${ags}
        <button class="ghost" data-skill-install="${i}" ${st.installed ? '' : 'disabled'}>启用到以上平台</button>
      </div>
    </div>`;
  }).join('');
  $('#modal').innerHTML = `
    <div class="m-head">
      <div class="logo">${esc(t.name.slice(0, 2).toUpperCase())}</div>
      <div>
        <h2>${esc(t.name)} <span class="type-tag">${esc(type)}</span></h2>
        <div class="card-fullname">${esc(t.fullName || '')} · ${badge(st)}</div>
      </div>
      <button class="m-close" id="m-close">✕</button>
    </div>
    <div class="m-section"><h3>📋 简介</h3><p>${esc(t.description)}</p></div>
    <div class="m-section"><h3>🎯 解决什么问题</h3><p>${esc(t.solves || '—')}</p></div>
    <div class="m-section"><h3>⚡ 能力</h3><div class="caps">${caps}</div></div>
    <div class="m-section"><h3>🔢 版本</h3><p>本地：${st.installed ? esc(st.localVersion || '?') : '未安装'} · 最新：${st.installed ? esc(st.latestVersion || '?') : '—'}（${PLATFORM_NAMES[PLATFORM] || PLATFORM}）</p></div>
    ${platInst.oneLiner ? `<div class="m-section"><h3>💾 本平台安装命令</h3><div class="oneliner">${esc(platInst.oneLiner)}</div></div>` : ''}
    ${skills ? `<div class="m-section"><h3>🧩 配套技能（按平台显示启用状态）</h3>${skills}</div>` : ''}
    <div class="actions" style="margin-top:6px">
      ${st.installed
        ? (st.hasUpdate ? `<button class="primary" data-install="${t.id}">⬆ 升级到 ${esc(st.latestVersion)}</button>` : `<button data-install="${t.id}">↻ 重装</button>`)
        : `<button class="primary" data-install="${t.id}">⬇ 一键安装（${PLATFORM_NAMES[PLATFORM] || PLATFORM}）</button>`}
      <button data-open="https://github.com/${esc(t.repo)}">${GH_ICON.replace('<svg', '<svg style="width:16px;height:16px;fill:currentColor;vertical-align:-3px"')} GitHub 仓库</button>
    </div>`;
  $('#modal-mask').classList.add('show');
  $('#m-close').onclick = closeModal;
  // 弹窗内启用技能后刷新状态
  $('#modal').querySelectorAll('[data-skill-install]').forEach(btn => btn.onclick = async () => {
    const idx = +btn.dataset.skillInstall;
    const s = t.skills[idx];
    btn.disabled = true; btn.textContent = '⏳ 启用中…';
    const r = await window.aihub.installSkill(t, s);
    showLog(`${s.name} → ${s.installCmd}\n${r.output || r.ok ? (r.ok ? '✅ 成功' : '❌ 失败') : ''}\n${r.output || ''}`);
    btn.textContent = r.ok ? '✔ 已启用' : '✘ 失败';
    skillStates[id] = await window.aihub.skillStatus(t);
    openDetail(id); // 重渲染弹窗
    render();
  });
}
function closeModal() { $('#modal-mask').classList.remove('show'); }

// ---------- 事件 ----------
grid.addEventListener('click', async e => {
  const btn = e.target.closest('button');
  const card = e.target.closest('.card');
  if (btn) {
    e.stopPropagation();
    const tools = registry.registry.tools;
    if (btn.dataset.install) {
      const t = tools.find(x => x.id === btn.dataset.install);
      btn.disabled = true; btn.textContent = '⏳ 执行中…';
      showLog(`正在为 ${PLATFORM_NAMES[PLATFORM]} 安装 ${t.name}…\n${t.install?.[PLATFORM]?.oneLiner || ''}\n`);
      const r = await window.aihub.installTool(t);
      showLog((log.textContent || '') + `\n--- 结果 ---\n${r.ok ? '✅ 成功' : '❌ 失败'}\n${r.output || ''}`);
      states[t.id] = await window.aihub.inspectTool(t);
      render();
    } else if (btn.dataset.open) {
      window.aihub.openExternal(btn.dataset.open);
    } else if (btn.dataset.detailBtn) {
      openDetail(btn.dataset.detailBtn); return;
    }
    return;
  }
  if (card) openDetail(card.dataset.detail); // 点卡片任意处 = 详情
});
$('#filters').addEventListener('click', e => {
  const chip = e.target.closest('.chip'); if (!chip) return;
  curType = chip.dataset.type; curPage = 1; render();
});
$('#search').addEventListener('input', e => { keyword = e.target.value.trim().toLowerCase(); curPage = 1; render(); });
$('#modal-mask').addEventListener('click', e => { if (e.target.id === 'modal-mask') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

$('#btn-check').onclick = async () => {
  $('#btn-check').disabled = true;
  showLog('开始检查所有工具更新…');
  const results = await window.aihub.checkAllUpdates(registry.registry.tools);
  results.forEach(r => { states[r.id] = r; });
  showLog(results.map(r => `${r.id}: ${r.installed ? (r.hasUpdate ? `${r.localVersion} → ${r.latestVersion} 可更新` : `已最新 ${r.localVersion}`) : '未安装'}`).join('\n'));
  render(); $('#btn-check').disabled = false;
};
$('#btn-registry').onclick = async () => { states = {}; skillStates = {}; curPage = 1; await boot(); };

// ---------- 应用自更新 ----------
const suBar = $('#self-update'), suText = $('#su-text'), suBtn = $('#su-action');
let suState = '';
window.aihub.appVersion().then(v => { suText.textContent = `当前版本 v${v}`; });
window.aihub.onUpdateEvent((evt, data) => {
  if (evt === 'available') {
    suState = 'available';
    suBar.style.display = 'flex';
    suText.innerHTML = `🚀 发现新版本 <b>v${esc(data.version)}</b>，可一键更新`;
    suBtn.style.display = ''; suBtn.textContent = '⬇ 立即下载'; suBtn.disabled = false;
    suBtn.onclick = () => { suBtn.disabled = true; suBtn.textContent = '⏳ 下载中…'; window.aihub.downloadUpdate(); };
  } else if (evt === 'not-available') {
    suText.textContent += ' · ✔ 已是最新';
  } else if (evt === 'progress') {
    suBtn.textContent = `⏳ ${data.percent}%（${data.mb}/${data.total} MB）`;
  } else if (evt === 'downloaded') {
    suState = 'downloaded';
    suText.innerHTML = '✅ 更新包已下载，重启后生效';
    suBtn.style.display = ''; suBtn.disabled = false; suBtn.textContent = '🔁 重启并安装';
    suBtn.onclick = () => window.aihub.installUpdate();
  } else if (evt === 'error') {
    suText.textContent += ' · 更新检查失败（离线或网络受限）';
  }
});

// ---------- 启动 ----------
async function boot() {
  PLATFORM = await window.aihub.platform();
  $('#platform-tag').textContent = '🖥 ' + (PLATFORM_NAMES[PLATFORM] || PLATFORM);
  grid.innerHTML = `<div class="empty">加载中…</div>`;
  registry = await window.aihub.loadRegistry();
  render();
  registry.registry.tools.forEach(async t => {
    states[t.id] = await window.aihub.inspectTool(t).catch(e => ({ id: t.id, error: String(e) }));
    if (states[t.id].installed && (t.skills || []).length) {
      try { skillStates[t.id] = await window.aihub.skillStatus(t); } catch {}
    }
    render();
  });
}
boot();
</script>
</body>
</html>
