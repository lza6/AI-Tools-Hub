<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI-Tools-Hub · 你的AI军火库</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --card: #1a2130; --border: #2d3748;
    --text: #e6edf3; --muted: #8b949e; --accent: #58a6ff; --green: #3fb950; --orange: #f0883e; --red: #f85149; --purple: #a371f7;
  }
  [data-theme="light"] {
    --bg: #f6f8fa; --panel: #ffffff; --card: #ffffff; --border: #d0d7de;
    --text: #1f2328; --muted: #656d76; --accent: #0969da; --green: #1a7f37; --orange: #bf5700; --red: #cf222e; --purple: #8250df;
  }
  [data-theme="midnight"] {
    --bg: #05070d; --panel: #0a0e18; --card: #0d1322; --border: #1e2a44;
    --text: #d8e2f4; --muted: #6b7a99; --accent: #7aa2f7; --green: #9ece6a; --orange: #e0af68; --red: #f7768e; --purple: #bb9af7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; transition: background .2s; }
  header { padding: 12px 24px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header img { height: 40px; border-radius: 8px; cursor: pointer; }
  header h1 { font-size: 19px; } header h1 span { color: var(--accent); }
  header .sub { color: var(--muted); font-size: 12px; }
  #toolbar { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  #platform-tag { font-size: 11px; color: var(--muted); border: 1px solid var(--border); padding: 4px 10px; border-radius: 20px; }
  button { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 7px 14px; cursor: pointer; font-size: 13px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.ghost { padding: 4px 10px; font-size: 12px; }
  button:disabled { opacity: .5; cursor: wait; }
  #filters { display: flex; gap: 8px; align-items: center; padding: 10px 24px 0; flex-wrap: wrap; }
  .chip { padding: 5px 13px; border-radius: 20px; font-size: 12px; cursor: pointer; background: var(--panel); border: 1px solid var(--border); color: var(--muted); user-select: none; }
  .chip:hover { color: var(--text); }
  .chip.active { background: color-mix(in srgb, var(--accent) 15%, transparent); border-color: var(--accent); color: var(--accent); }
  .chip .cnt { opacity: .7; margin-left: 3px; }
  .chip.cat { border-style: dashed; }
  #stats { padding: 8px 24px; color: var(--muted); font-size: 12px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  #search { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 7px 12px; font-size: 13px; width: 200px; outline: none; }
  #search:focus { border-color: var(--accent); }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; padding: 14px 24px 10px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; transition: border-color .15s; cursor: pointer; }
  .card:hover { border-color: var(--accent); }
  .card-head { display: flex; align-items: center; gap: 12px; }
  .logo { width: 44px; height: 44px; border-radius: 10px; background: var(--panel); border: 1px solid var(--border); flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; font-weight: 700; color: var(--muted); }
  .logo img { width: 100%; height: 100%; object-fit: cover; }
  .card-title { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card-fullname { font-size: 11px; color: var(--muted); }
  .type-tag { font-size: 10px; padding: 2px 8px; border-radius: 4px; background: color-mix(in srgb, var(--purple) 15%, transparent); color: var(--purple); border: 1px solid color-mix(in srgb, var(--purple) 40%, transparent); font-weight: 500; }
  .cat-tag { font-size: 10px; padding: 2px 8px; border-radius: 4px; background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
  .badge { margin-left: auto; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .badge.ok { color: var(--green); border: 1px solid color-mix(in srgb, var(--green) 40%, transparent); background: color-mix(in srgb, var(--green) 10%, transparent); }
  .badge.update { color: var(--orange); border: 1px solid color-mix(in srgb, var(--orange) 40%, transparent); background: color-mix(in srgb, var(--orange) 10%, transparent); }
  .badge.no { color: var(--red); border: 1px solid color-mix(in srgb, var(--red) 40%, transparent); background: color-mix(in srgb, var(--red) 8%, transparent); }
  .desc { font-size: 13px; line-height: 1.6; color: var(--text); opacity: .85; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .caps { display: flex; flex-wrap: wrap; gap: 6px; }
  .cap { font-size: 11px; padding: 3px 8px; border-radius: 4px; background: var(--panel); color: var(--muted); border: 1px solid var(--border); }
  .ver-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .ver-row b { color: var(--text); font-weight: 600; }
  .skill-line { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .agent-pill { font-size: 10px; padding: 2px 8px; border-radius: 10px; border: 1px solid var(--border); }
  .agent-pill.on { color: var(--green); border-color: color-mix(in srgb, var(--green) 40%, transparent); }
  .agent-pill.off { color: var(--muted); opacity: .7; }
  .conflict-note { font-size: 11px; color: var(--orange); background: color-mix(in srgb, var(--orange) 8%, transparent); border: 1px solid color-mix(in srgb, var(--orange) 30%, transparent); border-radius: 6px; padding: 6px 9px; }
  .actions { display: flex; gap: 8px; margin-top: auto; }
  .actions button { flex: 1; padding: 8px 0; }
  .actions button.icon-btn { flex: 0 0 40px; display: flex; align-items: center; justify-content: center; }
  .actions button.icon-btn svg { width: 18px; height: 18px; fill: var(--text); }
  /* 弹窗 */
  #modal-mask { display: none; position: fixed; inset: 0; background: #000000cc; z-index: 50; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 36px 20px; }
  #modal-mask.show { display: flex; }
  #modal { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; max-width: 780px; width: 100%; padding: 26px; display: flex; flex-direction: column; gap: 15px; }
  .m-head { display: flex; align-items: center; gap: 14px; }
  .m-head .logo { width: 56px; height: 56px; font-size: 18px; }
  #modal h2 { font-size: 20px; }
  .m-close { margin-left: auto; background: none; border: none; font-size: 22px; color: var(--muted); cursor: pointer; }
  .m-section h3 { font-size: 13px; color: var(--accent); margin-bottom: 6px; }
  .m-section p { font-size: 13px; line-height: 1.7; color: var(--text); opacity: .88; }
  .oneliner { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-family: Consolas, monospace; font-size: 12px; color: var(--green); overflow-x: auto; white-space: pre-wrap; }
  .skill-block { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
  .skill-agents { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #pager { display: flex; justify-content: center; align-items: center; gap: 10px; padding: 14px 0 32px; }
  .page-info { color: var(--muted); font-size: 12px; }
  /* 黑匣子日志 */
  #log-wrap { margin: 0 24px 10px; display: none; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  #log-wrap.show { display: block; }
  #log-head { background: var(--panel); padding: 8px 14px; font-size: 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
  #log { background: var(--bg); max-height: 260px; overflow: auto; padding: 12px 14px; font-family: Consolas, monospace; font-size: 12px; color: var(--green); white-space: pre-wrap; line-height: 1.6; }
  .empty { grid-column: 1/-1; text-align: center; color: var(--muted); padding: 60px 0; }
  .spin { display: inline-block; animation: r 1s linear infinite; } @keyframes r { to { transform: rotate(360deg); } }
  /* 主题切换 */
  #theme-btn { font-size: 16px; padding: 6px 10px; }
  /* 页签导航 */
  #nav { display: flex; gap: 4px; margin-left: 20px; }
  .nav-btn { background: none; border: none; font-size: 14px; padding: 10px 16px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; border-radius: 0; }
  .nav-btn:hover { color: var(--text); }
  .nav-btn.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .page { display: none; }
  .page.active { display: block; }
  /* 日志中心 */
  #page-logs .log-toolbar { display: flex; gap: 10px; align-items: center; padding: 14px 24px; flex-wrap: wrap; }
  #page-logs select { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font-size: 13px; }
  #log-search { background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 7px 12px; font-size: 13px; width: 220px; outline: none; }
  #log-view { margin: 0 24px 24px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 14px; font-family: Consolas, monospace; font-size: 12px; line-height: 1.7; white-space: pre-wrap; overflow: auto; max-height: calc(100vh - 250px); color: var(--muted); }
  .lv-ERROR { color: var(--red); font-weight: 600; }
  .lv-WARN { color: var(--orange); }
  .lv-INFO { color: var(--green); }
  .lv-DEBUG { color: var(--muted); opacity: .8; }
  #log-stats { padding: 0 24px 6px; color: var(--muted); font-size: 12px; display: flex; gap: 16px; }
  #live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; animation: pulse 1.5s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
</style>
</head>
<body>
<header>
  <img src="../assets/logo-256.png" alt="logo" onclick="cycleTheme()" title="点击切换主题">
  <h1>AI-Tools-<span>Hub</span></h1>
  <div class="sub">你的AI军火库 · CLI 工具 / MCP / 技能 / Hook 一站式安装与更新</div>
  <div id="toolbar">
    <span id="platform-tag"></span>
    <input id="search" placeholder="🔍 搜索工具…">
    <button id="btn-check">🔄 检查全部更新</button>
    <button id="btn-registry" class="primary">📦 刷新清单</button>
    <button id="theme-btn" title="切换主题">🌙</button>
  </div>
</header>

<div id="nav">
  <button class="nav-btn active" data-page="market">🧰 工具广场</button>
  <button class="nav-btn" data-page="logs">📋 日志中心</button>
</div>

<div id="page-market" class="page active">
<div id="self-update" style="display:none; margin: 10px 24px 0; padding: 10px 16px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 10%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); font-size: 13px; align-items:center; gap:12px;">
  <span id="su-text">当前版本…</span>
  <button id="su-action" class="ghost" style="display:none"></button>
</div>

<div id="filters"></div>
<div id="stats"></div>
<div id="grid"></div>
<div id="pager"></div>
</div><!-- /page-market -->

<div id="page-logs" class="page">
  <div class="log-toolbar">
    <span id="live-dot"></span><span style="font-size:13px;font-weight:600">实时日志</span>
    <select id="lg-level">
      <option value="DEBUG">等级: DEBUG（最详细）</option>
      <option value="INFO">等级: INFO</option>
      <option value="WARN">等级: WARN</option>
      <option value="ERROR">等级: ERROR</option>
    </select>
    <select id="lg-tag"><option value="">全部来源</option></select>
    <input id="log-search" placeholder="🔍 搜索日志内容…">
    <label style="font-size:12px;color:var(--muted);display:flex;align-items:center;gap:5px"><input type="checkbox" id="lg-live" checked> 实时刷新</label>
    <span style="flex:1"></span>
    <button class="ghost" id="lg-refresh">↻ 刷新</button>
    <button class="ghost" id="lg-export">💾 导出</button>
    <button class="ghost" id="lg-opendir">📂 日志目录</button>
    <button class="ghost" id="lg-clear">🗑 清空显示</button>
  </div>
  <div id="log-stats"></div>
  <div id="log-view">加载中…</div>
</div>

<div id="modal-mask"><div id="modal"></div></div>

<script>
const $ = s => document.querySelector(s);
const grid = $('#grid'), stats = $('#stats'), pager = $('#pager');
let registry = null, states = {}, skillStates = {}, curType = 'all', curCat = 'all', curPage = 1, keyword = '', PLATFORM = '';
const PAGE_SIZE = 9;
let registry = null, states = {}, skillStates = {}, curType = 'all', curCat = 'all', curPage = 1, keyword = '', PLATFORM = '';

const TYPE_NAMES = { 'cli-tool': 'CLI 工具', 'mcp': 'MCP 服务器', 'skill': '技能', 'hook': 'Hook', 'agent': 'Agent', 'extension': '扩展' };
const TYPE_DESCS = {
  'cli-tool': '命令行工具：安装后在终端/agent 中直接调用',
  'mcp': 'Model Context Protocol 服务器：为 AI 客户端提供工具能力，安装后配置到 Claude Code/Cursor 等客户端',
  'skill': 'Agent 技能：安装到 .claude/skills 等目录，扩展 agent 的领域知识',
  'hook': '钩子：挂在 agent 生命周期（如工具调用前后）自动执行',
  'agent': '独立 AI Agent 程序',
  'extension': 'IDE / 浏览器扩展'
};
const AGENT_NAMES = { 'claude-code': 'Claude Code', 'codex': 'Codex', 'claude-desktop': 'Claude Desktop', 'opencode': 'OpenCode', 'cursor': 'Cursor' };
const PLATFORM_NAMES = { win32: 'Windows', darwin: 'macOS', linux: 'Linux' };
const THEMES = ['dark', 'light', 'midnight'];

// ---------- 主题 ----------
let themeIdx = 0;
function cycleTheme() {
  themeIdx = (themeIdx + 1) % THEMES.length;
  document.documentElement.dataset.theme = THEMES[themeIdx] === 'dark' ? '' : THEMES[themeIdx];
  $('#theme-btn').textContent = ['🌙', '☀️', '🌌'][themeIdx];
  localStorage.setItem('aihub-theme', String(themeIdx));
}
themeIdx = +(localStorage.getItem('aihub-theme') || 0);
if (themeIdx) { document.documentElement.dataset.theme = THEMES[themeIdx] === 'dark' ? '' : THEMES[themeIdx]; $('#theme-btn').textContent = ['🌙', '☀️', '🌌'][themeIdx]; }
$('#theme-btn').onclick = cycleTheme;

function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }
const GH_ICON = `<svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>`;
function avatarHTML(t) {
  const ghAvatar = t.repo ? `<img src="https://github.com/${esc(t.repo.split('/')[0])}.png?size=88" onerror="this.remove()">` : '';
  const fallback = `<span>${esc(t.name.slice(0, 2).toUpperCase())}</span>`;
  return `<div class="logo">${ghAvatar}${fallback}</div>`;
}

// ---------- 日志中心（黑匣子已移除，安装时自动跳日志中心） ----------

// ---------- 数据 ----------
function filteredTools() {
  return registry.registry.tools.filter(t =>
    (curType === 'all' || (t.type || 'cli-tool') === curType) &&
    (curCat === 'all' || (t.category || '其他') === curCat) &&
    (!keyword || (t.name + t.fullName + t.description + (t.capabilities || []).join(' ') + (t.category || '')).toLowerCase().includes(keyword))
  );
}
function badge(st) {
  if (!st) return `<span class="badge no">检测中…</span>`;
  if (st.hasUpdate) return `<span class="badge update">⬆ ${esc(st.latestVersion)}</span>`;
  if (st.installed) return `<span class="badge ok">✔ ${esc(st.localVersion)}</span>`;
  return `<span class="badge no">未安装</span>`;
}
function skillLine(t) {
  const st = skillStates[t.id] || {};
  return (t.skills || []).map(s => {
    const pills = (s.agents || []).map(a => {
      const on = st[s.name]?.[a];
      return `<span class="agent-pill ${on ? 'on' : 'off'}">${esc(AGENT_NAMES[a] || a)}: ${on ? '✔ 已启用' : on === undefined ? '…' : '未启用'}</span>`;
    }).join(' ');
    return `<div class="skill-line">🧩 ${esc(s.name)} ${pills}</div>`;
  }).join('');
}
function conflictHTML(t) {
  if (!t.conflicts || !t.conflicts.length) return '';
  return `<div class="conflict-note">⚠️ 冲突提示：${esc(t.conflicts.join('；'))}</div>`;
}
function cardHTML(t) {
  const st = states[t.id];
  const type = t.type || 'cli-tool';
  return `
  <div class="card" data-detail="${t.id}">
    <div class="card-head">
      ${avatarHTML(t)}
      <div>
        <div class="card-title">${esc(t.name)} <span class="type-tag" title="${esc(TYPE_DESCS[type] || '')}">${esc(TYPE_NAMES[type] || type)}</span>${t.category ? `<span class="cat-tag">${esc(t.category)}</span>` : ''}</div>
        <div class="card-fullname">${esc(t.fullName || '')}</div>
      </div>
      ${badge(st)}
    </div>
    <div class="desc">${esc(t.description)}</div>
    <div class="caps">${(t.capabilities || []).slice(0, 4).map(c => `<span class="cap">${esc(c)}</span>`).join('')}</div>
    <div class="ver-row"><span>本地：<b>${st?.installed ? esc(st.localVersion || '?') : '—'}</b></span><span>最新：<b>${st?.installed ? esc(st.latestVersion || '?') : '—'}</b></span></div>
    ${skillLine(t)}
    ${conflictHTML(t)}
    <div class="actions">
      ${st?.installed
        ? (st.hasUpdate ? `<button class="primary" data-install="${t.id}">⬆ 升级 ${esc(st.latestVersion)}</button>` : `<button data-install="${t.id}">↻ 重装</button>`)
        : `<button class="primary" data-install="${t.id}">⬇ 一键安装</button>`}
      <button class="icon-btn" title="GitHub 仓库" data-open="https://github.com/${esc(t.repo || '')}">${GH_ICON}</button>
      <button class="icon-btn" title="详情" data-detail-btn="${t.id}">📄</button>
    </div>
  </div>`;
}
function render() {
  const tools = registry.registry.tools;
  const types = [...new Set(tools.map(t => t.type || 'cli-tool'))];
  const cats = [...new Set(tools.map(t => t.category || '其他'))];
  $('#filters').innerHTML =
    `<span class="chip ${curType === 'all' && curCat === 'all' ? 'active' : ''}" data-type="all">全部 <span class="cnt">${tools.length}</span></span>` +
    types.map(tp => `<span class="chip ${curType === tp ? 'active' : ''}" data-type="${esc(tp)}" title="${esc(TYPE_DESCS[tp] || '')}">${esc(TYPE_NAMES[tp] || tp)} <span class="cnt">${tools.filter(x => (x.type || 'cli-tool') === tp).length}</span></span>`).join('') +
    `<span style="width:1px;height:18px;background:var(--border);margin:0 4px"></span>` +
    cats.map(c => `<span class="chip cat ${curCat === c ? 'active' : ''}" data-cat="${esc(c)}">📂 ${esc(c)}</span>`).join('');
  const list = filteredTools();
  const totalPages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  curPage = Math.min(curPage, totalPages);
  grid.innerHTML = list.slice((curPage - 1) * PAGE_SIZE, curPage * PAGE_SIZE).map(cardHTML).join('') || `<div class="empty">没有匹配的工具</div>`;
  pager.innerHTML = totalPages > 1 ? `
    <button class="ghost" id="pg-prev" ${curPage <= 1 ? 'disabled' : ''}>‹ 上一页</button>
    <span class="page-info">第 ${curPage} / ${totalPages} 页 · 共 ${list.length} 个</span>
    <button class="ghost" id="pg-next" ${curPage >= totalPages ? 'disabled' : ''}>下一页 ›</button>` : '';
  const prev = $('#pg-prev'), next = $('#pg-next');
  if (prev) prev.onclick = () => { curPage--; render(); };
  if (next) next.onclick = () => { curPage++; render(); };
  updateStats();
}
function updateStats() {
  const tools = registry.registry.tools;
  const installed = tools.filter(t => states[t.id]?.installed).length;
  const updates = tools.filter(t => states[t.id]?.hasUpdate).length;
  const detected = tools.filter(t => states[t.id]).length;
  stats.innerHTML = `<span>清单：${registry.source === 'remote' ? 'GitHub 远程' : '内置'}</span><span>共 ${tools.length} 个</span><span>已装 ${installed}</span><span style="color:${updates ? 'var(--orange)' : 'inherit'}">可更新 ${updates}</span>${detected < tools.length ? `<span><span class="spin">⏳</span> ${detected}/${tools.length}</span>` : ''}`;
}

// ---------- 详情弹窗 ----------
async function openDetail(id) {
  const t = registry.registry.tools.find(x => x.id === id);
  if (!t) return;
  const st = states[id] || {};
  const type = t.type || 'cli-tool';
  const platInst = t.install?.[PLATFORM] || t.install?.windows || t.install?.linux || {};
  const skills = (t.skills || []).map((s, i) => {
    const ags = (s.agents || []).map(a => {
      const on = skillStates[id]?.[s.name]?.[a];
      return `<span class="agent-pill ${on ? 'on' : 'off'}">${esc(AGENT_NAMES[a] || a)}: ${on ? '✔ 已启用' : on === false ? '未启用' : '…'}</span>`;
    }).join(' ');
    return `<div class="skill-block">
      <div><b>🧩 ${esc(s.name)}</b> <span style="color:var(--muted);font-size:11px">· ${esc((s.agents || []).map(a => AGENT_NAMES[a] || a).join('/'))}</span></div>
      <div style="font-size:12px;color:var(--muted)">${esc(s.description || '')}</div>
      <div class="skill-agents">${ags}<button class="ghost" data-skill-install="${i}" ${st.installed ? '' : 'disabled'}>启用到以上平台</button></div>
    </div>`;
  }).join('');
  $('#modal').innerHTML = `
    <div class="m-head">${avatarHTML(t)}
      <div><h2>${esc(t.name)} <span class="type-tag">${esc(TYPE_NAMES[type] || type)}</span>${t.category ? `<span class="cat-tag">${esc(t.category)}</span>` : ''}</h2>
      <div class="card-fullname">${esc(t.fullName || '')} · ${badge(st)}</div></div>
      <button class="m-close" id="m-close">✕</button></div>
    <div class="m-section"><h3>📌 这是什么</h3><p>${esc(TYPE_DESCS[type] || '')}</p><p style="margin-top:6px">${esc(t.description)}</p></div>
    <div class="m-section"><h3>🎯 解决什么问题</h3><p>${esc(t.solves || '—')}</p></div>
    <div class="m-section"><h3>⚡ 能力</h3><div class="caps">${(t.capabilities || []).map(c => `<span class="cap">${esc(c)}</span>`).join('')}</div></div>
    ${conflictHTML(t)}
    ${t.usage ? `<div class="m-section"><h3>📖 使用说明</h3>
      <p style="margin-bottom:8px"><b>快速开始：</b><span class="oneliner" style="display:inline-block;padding:4px 10px;margin-left:6px">${esc(t.usage.quickStart)}</span> — ${esc(t.usage.quickStartDesc || '')}</p>
      <div style="display:flex;flex-direction:column;gap:6px;margin:8px 0">
        ${(t.usage.commands || []).map(c => `<div style="display:flex;gap:10px;align-items:baseline"><code style="background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:3px 8px;font-size:12px;color:var(--green);white-space:nowrap;flex-shrink:0">${esc(c.cmd)}</code><span style="font-size:12px;color:var(--muted)">${esc(c.desc)}</span></div>`).join('')}
      </div>
      <p style="font-size:12px;color:var(--muted);background:var(--bg);border-left:3px solid var(--accent);padding:8px 10px;border-radius:0 6px 6px 0">💡 ${esc(t.usage.notes || '')}</p>
    </div>` : ''}
    <div class="m-section"><h3>🔢 版本（${PLATFORM_NAMES[PLATFORM] || PLATFORM}）</h3><p>本地：${st.installed ? esc(st.localVersion || '?') : '未安装'} · 最新：${st.installed ? esc(st.latestVersion || '?') : '—'}</p></div>
    ${platInst.oneLiner ? `<div class="m-section"><h3>💾 安装方式</h3><div class="oneliner">${esc(platInst.oneLiner)}</div></div>` : ''}
    ${skills ? `<div class="m-section"><h3>🧩 配套技能（按平台显示启用状态）</h3>${skills}</div>` : ''}
    <div class="actions" style="margin-top:4px">
      ${st.installed
        ? (st.hasUpdate ? `<button class="primary" data-install="${t.id}">⬆ 升级到 ${esc(st.latestVersion)}</button>` : `<button data-install="${t.id}">↻ 重装</button>`)
        : `<button class="primary" data-install="${t.id}">⬇ 一键安装</button>`}
      <button data-open="https://github.com/${esc(t.repo)}">${GH_ICON.replace('<svg', '<svg style="width:16px;height:16px;fill:currentColor;vertical-align:-3px"')} GitHub 仓库</button>
    </div>`;
  $('#modal-mask').classList.add('show');
  $('#m-close').onclick = closeModal;
  $('#modal').querySelectorAll('[data-skill-install]').forEach(btn => btn.onclick = async () => {
    const s = t.skills[+btn.dataset.skillInstall];
    btn.disabled = true; btn.textContent = '⏳ 启用中…';
    const r = await window.aihub.installSkill(t, s);
    appendLog(`🧩 技能启用 [${s.name}] → ${s.installCmd}\n${r.ok ? '✅ 成功' : '❌ 失败'}\n${r.output || ''}\n`);
    btn.textContent = r.ok ? '✔ 已启用' : '✘ 失败';
    skillStates[id] = await window.aihub.skillStatus(t);
    openDetail(id); render();
  });
}
function closeModal() { $('#modal-mask').classList.remove('show'); }
// ---------- 日志跳转辅助（替代旧黑匣子） ----------
function gotoLogs(tag) {
  document.querySelector('[data-page="logs"]').click();
  if (tag !== undefined) { logFilter.tag = tag; const s = $('#lg-tag'); if (s) s.value = tag; }
  refreshLogs();
}
function appendLog(text) { /* 兼容占位：日志统一进日志中心 */ }

// ---------- 事件 ----------
grid.addEventListener('click', async e => {
  const btn = e.target.closest('button');
  const card = e.target.closest('.card');
  if (btn) {
    e.stopPropagation();
    const tools = registry.registry.tools;
    if (btn.dataset.install) {
      const t = tools.find(x => x.id === btn.dataset.install);
      btn.disabled = true; btn.textContent = '⏳ 执行中…';
      gotoLogs(`install:${t.id}`); // 自动跳日志中心看实时过程
      const r = await window.aihub.installTool(t);
      const ok = r.ok;
      states[t.id] = await window.aihub.inspectTool(t);
      render();
      if ($('#page-logs').classList.contains('active')) refreshLogs();
      if (!ok) { document.querySelector('[data-page="market"]').click(); alert(`安装失败，详情见日志中心\n\n${(r.output || r.error || '').slice(-500)}`); }
    } else if (btn.dataset.open) window.aihub.openExternal(btn.dataset.open);
    else if (btn.dataset.detailBtn) { openDetail(btn.dataset.detailBtn); return; }
    return;
  }
  if (card) openDetail(card.dataset.detail);
});
$('#filters').addEventListener('click', e => {
  const chip = e.target.closest('.chip'); if (!chip) return;
  if (chip.dataset.type !== undefined && chip.dataset.type !== null && chip.hasAttribute('data-type')) { curType = chip.dataset.type; curCat = 'all'; }
  if (chip.hasAttribute('data-cat')) { curCat = chip.dataset.cat; curPage = 1; render(); return; }
  curPage = 1; render();
});
$('#search').addEventListener('input', e => { keyword = e.target.value.trim().toLowerCase(); curPage = 1; render(); });
$('#modal-mask').addEventListener('click', e => { if (e.target.id === 'modal-mask') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
$('#btn-check').onclick = async () => {
  $('#btn-check').disabled = true;
  const results = await window.aihub.checkAllUpdates(registry.registry.tools);
  results.forEach(r => { states[r.id] = r; });
  appendLog(results.map(r => `${r.id}: ${r.installed ? (r.hasUpdate ? `${r.localVersion} → ${r.latestVersion} 可更新` : `已最新 ${r.localVersion}`) : '未安装'}`).join('\n'));
  render(); $('#btn-check').disabled = false;
};
$('#btn-registry').onclick = async () => { states = {}; skillStates = {}; curPage = 1; await boot(); };

// ---------- 页签导航 ----------
document.querySelectorAll('.nav-btn').forEach(b => b.onclick = () => {
  document.querySelectorAll('.nav-btn').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.id === 'page-' + b.dataset.page));
  if (b.dataset.page === 'logs') refreshLogs();
});

// ---------- 日志中心 ----------
let logFilter = { level: 'DEBUG', tag: '', keyword: '' };
let logTags = new Set();
function renderLogEntries(entries) {
  const counts = { ERROR: 0, WARN: 0, INFO: 0, DEBUG: 0 };
  entries.forEach(e => counts[e.level] = (counts[e.level] || 0) + 1);
  $('#log-stats').innerHTML = `<span>共 ${entries.length} 条</span><span class="lv-ERROR">错误 ${counts.ERROR}</span><span class="lv-WARN">警告 ${counts.WARN}</span><span class="lv-INFO">信息 ${counts.INFO}</span><span class="lv-DEBUG">调试 ${counts.DEBUG}</span><span>💾 文件落盘: userData/logs（按天+2MB 轮转，保留 7 天）</span>`;
  $('#log-view').innerHTML = entries.map(e => {
    const d = new Date(e.t);
    const ts = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}:${String(d.getSeconds()).padStart(2, '0')}.${String(d.getMilliseconds()).padStart(3, '0')}`;
    return `<div><span style="opacity:.5">${ts}</span> <span class="lv-${e.level}">[${e.level}]</span> <span style="color:var(--accent)">[${esc(e.tag)}]</span> ${esc(e.msg)}</div>`;
  }).join('') || '（暂无匹配日志）';
  $('#log-view').scrollTop = $('#log-view').scrollHeight;
}
async function refreshLogs() {
  const entries = await window.aihub.logsQuery(logFilter);
  entries.forEach(e => logTags.add(e.tag));
  const tagSel = $('#lg-tag');
  const cur = tagSel.value;
  tagSel.innerHTML = '<option value="">全部来源</option>' + [...logTags].sort().map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  tagSel.value = cur;
  renderLogEntries(entries);
}
$('#lg-level').onchange = e => { logFilter.level = e.target.value; refreshLogs(); };
$('#lg-tag').onchange = e => { logFilter.tag = e.target.value; refreshLogs(); };
$('#log-search').addEventListener('input', e => { logFilter.keyword = e.target.value.trim(); refreshLogs(); });
$('#lg-refresh').onclick = refreshLogs;
$('#lg-clear').onclick = async () => { await window.aihub.logsClear(); refreshLogs(); };
$('#lg-opendir').onclick = () => window.aihub.logsOpenDir();
$('#lg-export').onclick = async () => {
  const text = await window.aihub.logsDump();
  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `aihub-logs-${new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-')}.log`;
  a.click();
};
setInterval(() => { if ($('#page-logs').classList.contains('active') && $('#lg-live').checked) refreshLogs(); }, 1500);

// ---------- 应用自更新 ----------
const suBar = $('#self-update'), suText = $('#su-text'), suBtn = $('#su-action');
window.aihub.appVersion().then(v => { suText.textContent = `当前版本 v${v}`; });
window.aihub.onUpdateEvent((evt, data) => {
  if (evt === 'available') {
    suBar.style.display = 'flex';
    suText.innerHTML = `🚀 发现新版本 <b>v${esc(data.version)}</b>，可一键更新`;
    suBtn.style.display = ''; suBtn.textContent = '⬇ 立即下载'; suBtn.disabled = false;
    suBtn.onclick = () => { suBtn.disabled = true; suBtn.textContent = '⏳ 下载中…'; window.aihub.downloadUpdate(); };
  } else if (evt === 'not-available') suText.textContent += ' · ✔ 已是最新';
  else if (evt === 'progress') suBtn.textContent = `⏳ ${data.percent}%（${data.mb}/${data.total} MB）`;
  else if (evt === 'downloaded') {
    suText.innerHTML = '✅ 更新包已下载，重启后生效';
    suBtn.style.display = ''; suBtn.disabled = false; suBtn.textContent = '🔁 重启并安装';
    suBtn.onclick = () => window.aihub.installUpdate();
  } else if (evt === 'error') suText.textContent += ' · 更新检查失败（离线或网络受限）';
});

// ---------- 启动 ----------
async function boot() {
  PLATFORM = await window.aihub.platform();
  $('#platform-tag').textContent = '🖥 ' + (PLATFORM_NAMES[PLATFORM] || PLATFORM);
  grid.innerHTML = `<div class="empty">加载中…</div>`;
  registry = await window.aihub.loadRegistry();
  render();
  registry.registry.tools.forEach(async t => {
    states[t.id] = await window.aihub.inspectTool(t).catch(e => ({ id: t.id, error: String(e) }));
    if (states[t.id].installed && (t.skills || []).length) {
      try { skillStates[t.id] = await window.aihub.skillStatus(t); } catch {}
    }
    render();
  });
}
boot();
</script>
</body>
</html>
